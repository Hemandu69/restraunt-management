name: Database Deploy

# Deploys migrations to the linked production Supabase project. Only ever
# triggered by a push to `main` (i.e. after a PR - and this workflow's own
# database-test.yml run - has already merged), and only when
# database-related files actually changed.
#
# Never runs `supabase db reset --linked` or any other destructive command
# against the linked project - only `supabase db push`, which applies
# migrations that are not yet in the remote history.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/database-deploy.yml"

concurrency:
  group: database-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the production Supabase project
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Verify remote migration history before deploying
        run: supabase migration list --linked

      - name: Deploy migrations (non-destructive)
        run: supabase db push --linked
